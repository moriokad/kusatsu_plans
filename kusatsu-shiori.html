<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1C4A38">
<meta name="description" content="新旧総括会議 in 草津（2026/9/12-13）旅のしおりと準備チェック">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>草津しおり 配布版</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --ground:#EDEFE8;
    --surface:#FBFCF8;
    --surface-2:#F4F6EF;
    --ink:#17251E;
    --muted:#5C6B62;
    --line:#D6DCD2;
    --brand:#1C4A38;
    --brand-ink:#0F2C21;
    --brand-soft:#E0EAE1;
    --accent:#B95E1C;
    --accent-soft:#F6E7DA;
    --ok:#2F7A54;
    --on-brand:#F6FAF6;
    --shadow:0 1px 2px rgba(23,37,30,.06), 0 8px 24px -18px rgba(23,37,30,.35);
    --radius:14px;
    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#101511;
      --surface:#19201B;
      --surface-2:#1F2821;
      --ink:#E7EEE6;
      --muted:#9AA99E;
      --line:#2D3830;
      --brand:#79B896;
      --brand-ink:#CDE6D8;
      --brand-soft:#1E2E26;
      --accent:#E39158;
      --accent-soft:#32251C;
      --ok:#69B98D;
      --on-brand:#0E1712;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"]{
    --ground:#101511;
    --surface:#19201B;
    --surface-2:#1F2821;
    --ink:#E7EEE6;
    --muted:#9AA99E;
    --line:#2D3830;
    --brand:#79B896;
    --brand-ink:#CDE6D8;
    --brand-soft:#1E2E26;
    --accent:#E39158;
    --accent-soft:#32251C;
    --ok:#69B98D;
    --on-brand:#0E1712;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:var(--jp); font-size:15px; line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
  a{color:var(--brand);text-underline-offset:3px}

  /* ── header ───────────────────────────────── */
  .hero{padding-block:22px 16px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h1{font-size:clamp(25px,7vw,34px);font-weight:900;line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.01em}
  h1 .sub{display:block;font-size:.52em;font-weight:700;color:var(--brand);letter-spacing:.02em;margin-top:6px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
  .chip b{color:var(--ink);font-weight:700}
  .chip.mono{font-family:var(--mono);font-size:11.5px}
  .countdown{margin-top:14px;display:flex;align-items:baseline;gap:8px;background:var(--brand);color:var(--on-brand);border-radius:var(--radius);padding:10px 14px}
  .countdown .big{font-family:var(--mono);font-weight:700;font-size:20px;white-space:nowrap;flex:0 0 auto}
  .countdown .txt{font-size:12.5px;opacity:.9}

  /* ── who am I ─────────────────────────────── */
  .whoami{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;box-shadow:var(--shadow)}
  .whoami{flex-wrap:wrap}
  .whoami .localnote{flex:1 1 100%;order:3;font-size:11.5px;color:var(--muted);line-height:1.5}
  .whoami .reset{margin-left:auto;font-family:var(--jp);font-size:11.5px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer}
  .whoami .reset:hover{color:var(--accent);border-color:var(--accent)}
  .sync{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
  .sync.on{color:var(--ok)}
  .sync.off{color:var(--accent)}

  /* ── tabs ─────────────────────────────────── */
  nav.tabs{position:sticky;top:0;z-index:20;margin-top:16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
  .tabs-inner{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:7px 0}
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:0;background:transparent;font-family:var(--jp);font-size:13.5px;font-weight:700;color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tab .badge{font-family:var(--mono);font-size:10px;font-weight:700;padding:1px 5px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .tab[aria-selected="true"] .badge{background:rgba(255,255,255,.22);color:inherit}
  .tab .badge.done{background:var(--brand-soft);color:var(--ok)}

  /* ── sections ─────────────────────────────── */
  section{padding-block:20px 8px}
  section[hidden]{display:none!important}
  h2{font-size:12px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px;font-weight:700}
  section > h2:first-child{margin-top:4px}
  h3{font-size:16px;font-weight:700;margin:0 0 4px}
  p{margin:0 0 10px}
  .lead{color:var(--muted);font-size:13.5px;margin-bottom:14px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

  .kv{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;font-size:14px}
  .kv dt{font-size:12px;color:var(--muted);padding-top:3px}
  .kv dd{margin:0;font-weight:500}
  .kv dd .mono{font-family:var(--mono);font-weight:700}

  .note{font-size:12.5px;color:var(--muted)}
  .warn{display:flex;gap:8px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink)}
  .warn b{color:var(--accent)}

  /* car groups */
  .car{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
  .car:first-of-type{border-top:0;padding-top:2px}
  .car .no{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--on-brand);background:var(--brand);border-radius:8px;padding:2px 8px;flex:0 0 auto;margin-top:2px}
  .car .names{font-size:14px;font-weight:500}

  /* timeline */
  .tl{list-style:none;margin:0;padding:0}
  .tl li{display:grid;grid-template-columns:52px 1fr;gap:12px;position:relative;padding-bottom:16px}
  .tl li::before{content:"";position:absolute;left:57px;top:20px;bottom:0;width:1px;background:var(--line)}
  .tl li:last-child::before{display:none}
  .tl .t{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--brand);text-align:right;padding-top:1px}
  .tl .body{position:relative;padding-left:16px}
  .tl .body::before{content:"";position:absolute;left:-6px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--brand);border:2px solid var(--ground)}
  .tl li.opt .body::before{background:var(--accent)}
  .tl .ttl{font-weight:700;font-size:15px}
  .tl .desc{font-size:13px;color:var(--muted)}
  .tag{display:inline-block;font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;padding:1px 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand);margin-left:6px;vertical-align:1px;font-weight:700}
  .tl li.opt .tag{background:var(--accent-soft);color:var(--accent)}

  /* checklists */
  .progress{display:flex;align-items:center;gap:10px;margin:0 0 10px}
  .bar{flex:1;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .25s ease}
  .pct{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

  ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  ul.checks > li{border-top:1px solid var(--line);display:flex;align-items:stretch;gap:2px}
  ul.checks > li:first-child{border-top:0}
  .row{display:flex;align-items:flex-start;gap:11px;flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:11px 2px;font-family:var(--jp);font-size:14.5px;color:var(--ink);cursor:pointer;line-height:1.5}
  .del{flex:0 0 auto;align-self:center;background:transparent;border:1px solid transparent;color:var(--muted);font-family:var(--mono);font-size:12px;line-height:1;padding:7px 8px;border-radius:9px;cursor:pointer}
  .del[data-armed="1"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700;font-family:var(--jp);font-size:11.5px}
  .del:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .addform{display:flex;gap:6px;margin-top:10px;padding-top:11px;border-top:1px dashed var(--line)}
  .addform input{flex:1;min-width:0;font-family:var(--jp);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
  .addform input:focus-visible{outline:2px solid var(--brand);outline-offset:-1px}
  .addform button{flex:0 0 auto;font-family:var(--jp);font-weight:700;font-size:13px;padding:8px 14px;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);cursor:pointer}
  .empty{font-size:13px;color:var(--muted);padding:12px 2px 2px}
  .added{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1.5px}
  .row:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:8px}
  .box{flex:0 0 auto;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);margin-top:1px;display:grid;place-items:center;transition:background .15s,border-color .15s}
  .box svg{width:13px;height:13px;opacity:0;stroke:var(--on-brand);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .row[data-on="1"] .box{background:var(--brand);border-color:var(--brand)}
  .row[data-on="1"] .box svg{opacity:1}
  .row .txt{flex:1;min-width:0}
  .row .name{font-weight:500}
  .row[data-on="1"] .name{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
  .row .sub{display:block;font-size:12px;color:var(--muted);font-weight:400;text-decoration:none}
  .row .by[hidden]{display:none}
  .row .by{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ok);background:var(--brand-soft);border-radius:6px;padding:1px 6px;margin-top:3px}
  .row .price{flex:0 0 auto;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;padding-top:2px}
  .row .qty{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:0 5px;margin-left:5px}

  /* multi (per person) */
  .who-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .who{font-family:var(--mono);font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
  .who.me{background:var(--brand-soft);border-color:transparent;color:var(--ok);font-weight:700}
  .count{flex:0 0 auto;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}

  /* shopping totals */
  .total{display:flex;gap:14px;background:var(--brand);color:var(--on-brand);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
  .total > div{flex:1;min-width:0;display:flex;flex-direction:column}
  .total > div + div{border-left:1px solid rgba(255,255,255,.18);padding-left:14px}
  .total .l{font-size:11.5px;opacity:.88}
  .total .v{font-family:var(--mono);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
  .total .v.sub{font-size:17px;opacity:.9}

  /* price button + inline editor */
  .pbtn{flex:0 0 auto;align-self:flex-start;margin-top:10px;background:transparent;border:0;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding:1px 2px;cursor:pointer}
  .pbtn:hover,.pbtn:focus-visible{color:var(--accent);border-bottom-color:var(--accent)}
  li.editli{display:block;padding:2px 2px 14px;border-top:0}
  .editor{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
  .editor label{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}
  .editor input{display:block;width:100%;font-family:var(--jp);font-size:14.5px;margin-top:3px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
  .editor .cols{display:flex;gap:8px}
  .editor .cols label{flex:1}
  .editor input[type="number"]{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .editor .ebtns{display:flex;align-items:center;gap:8px;margin-top:2px}
  .editor .ebtns button{font-family:var(--jp);font-weight:700;font-size:13px;padding:8px 14px;border:0;border-radius:9px;cursor:pointer}
  .editor .save{background:var(--brand);color:var(--on-brand)}
  .editor .cancel{background:transparent;color:var(--muted);border:1px solid var(--line)!important}
  .editor .esum{margin-left:auto;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--muted)}
  .addgrid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px;padding-top:11px;border-top:1px dashed var(--line)}
  .addgrid .cols{display:flex;gap:6px}
  .addgrid input{width:100%;font-family:var(--jp);font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
  .addgrid input[type="number"]{font-family:var(--mono);flex:1;min-width:0}
  .addgrid button{flex:0 0 auto;font-family:var(--jp);font-weight:700;font-size:13px;padding:8px 16px;border:0;border-radius:10px;background:var(--brand);color:var(--on-brand);cursor:pointer}

  details.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  details.cat + details.cat{margin-top:10px}
  details.cat > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;font-size:15px}
  details.cat > summary::-webkit-details-marker{display:none}
  details.cat > summary .mark{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
  details.cat > summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-weight:700;width:14px;text-align:center}
  details.cat[open] > summary::after{content:"–"}
  details.cat > div{padding:0 14px 8px}
  .footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
  .footer b{color:var(--ink)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <p class="eyebrow">2026.09.12 – 09.13 ｜ 1泊2日</p>
    <h1>新旧総括会議 in 草津<span class="sub">旅のしおり ＆ 準備チェック</span></h1>
    <div class="meta">
      <span class="chip">群馬県 草津温泉</span>
      <span class="chip">宿 <b>湯音の森【松】</b></span>
      <span class="chip">参加 <b>10名</b></span>
      <span class="chip mono">車3台</span>
    </div>
    <div class="countdown"><span class="big" id="cd">–</span><span class="txt" id="cdTxt">集合まで</span></div>
    <div class="whoami">
      <span class="sync on" id="sync">この端末に保存</span>
      <span class="localnote">チェックはお使いのスマホに保存されます（他の人には共有されません）</span>
      <button type="button" class="reset" id="reset">リセット</button>
    </div>
  </header>

  <nav class="tabs"><div class="tabs-inner" id="tabs" role="tablist"></div></nav>

  <main id="panes"></main>

  <p class="footer">元データ：<b>932研修しおり.pptx</b>（全16スライド）をスマホ用に再構成。チェック・項目の追加・金額の修正は<b>お使いの端末のブラウザにのみ保存</b>されます（他の参加者には共有されません）。ブラウザの履歴やサイトデータを消すとチェックも消えます。楽しく、安全に、時間には少し余裕を！</p>
</div>

<script>
/* ────────── data ────────── */
const PEOPLE = ["森岡","及川","山脇","佐藤","平","小池","萱沼","永濱","佐々木","海老澤"];

const CARS = [
  ["車①","森岡さん・及川さん・山脇さん・佐藤さん"],
  ["車②","平さん・小池さん・萱沼さん・永濱・佐々木さん"],
  ["車③","海老澤さん"]
];

const DAY1 = [
  {t:"12:00", ttl:"集合", desc:"草津温泉バスターミナル 1階待合スペース付近。車の方は周辺駐車場へ。", tag:"集合"},
  {t:"12:15", ttl:"湯畑・温泉街", desc:"足湯・お土産店などゆったり散策。"},
  {t:"13:30", ttl:"昼食：和牛 三国家", desc:"10名 予約済。直接集合もOK。", link:{href:"https://maps.app.goo.gl/sYkosutGxqHDWzXf8", label:"Google Maps で開く"}, tag:"予約済"},
  {t:"14:30", ttl:"西の河原公園", desc:"温泉が川のように流れる景勝地。遊歩道をゆっくり散策。"},
  {t:"15:30", ttl:"チェックイン／BBQ買い出し・火起こし", desc:"湯音の森にチェックイン。班に分かれて約1時間は準備！"},
  {t:"17:00", ttl:"BBQ スタート♪", desc:"スライド8では「18:00 BBQ懇親会」表記。火起こしの進み次第で。", tag:"懇親会"},
  {t:"21:00", ttl:"夜の湯畑散策", desc:"BBQ後、希望者でライトアップされた温泉街へ。花火もできます！", tag:"自由参加", opt:true}
];

const DAY2 = [
  {t:"7:00", ttl:"朝食／風呂", desc:"各自でゆっくり。出発準備も忘れずに。余裕があれば裏草津（地蔵の湯周辺・足湯・カフェ）散策も。", tag:"自由", opt:true},
  {t:"10:00", ttl:"チェックアウト", desc:"先に行ける人は10時までに湯もみの販売所に並ぶ。予約不可・公演30分前からチケット販売。", tag:"要対応"},
  {t:"10:30", ttl:"「湯もみと踊り」ショー", desc:"熱乃湯。草津節に合わせた伝統の湯もみを間近で体感。", link:{href:"https://www.kusatsu-onsen.ne.jp/netsunoyu/show.html", label:"熱乃湯 公演情報"}},
  {t:"11:15", ttl:"昼食", desc:"いきたいご飯処・場所 募集中！", tag:"募集中", opt:true},
  {t:"12:30", ttl:"道の駅 草津運動茶屋公園", desc:"地元グルメとお土産購入。"},
  {t:"13:00", ttl:"出発", desc:"13:00 ごろ帰路へ。"}
];

/* ────────── state ────────── */
let state = {single:{}, multi:{}, extra:{}, hidden:{}, edits:{}};
let docRef = null, docExists = false;
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yen = n=>"¥"+Math.round(n).toLocaleString("ja-JP");

const myName = "";
const STORE_KEY = "kusatsu.shiori.v1";
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const v = JSON.parse(raw) || {};
    state = {single:v.single||{}, multi:v.multi||{}, extra:v.extra||{}, hidden:v.hidden||{}, edits:v.edits||{}};
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(fullState())); }
  catch(e){ setSyncLabel("保存できません", "off"); }
}

/* ────────── countdown ────────── */
(function(){
  const target = new Date("2026-09-12T12:00:00+09:00");
  const diff = target - new Date();
  const cd = document.getElementById("cd"), txt = document.getElementById("cdTxt");
  if(diff <= 0){ cd.textContent = "旅行中"; txt.textContent = "楽しく、安全に、時間には少し余裕を！"; return; }

})();

/* ────────── reset ────────── */
document.getElementById("reset").addEventListener("click", ()=>{
  const b = document.getElementById("reset");
  if(b.dataset.armed === "1"){
    state = {single:{}, multi:{}, extra:{}, hidden:{}, edits:{}};
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    b.dataset.armed = "0"; b.textContent = "リセット";
    sync();
    return;
  }
  b.dataset.armed = "1"; b.textContent = "もう一度押すと全消去";
  setTimeout(()=>{ b.dataset.armed = "0"; b.textContent = "リセット"; }, 3000);
});

/* ────────── builders ────────── */
function timeline(items){
  const ul = el("ul","tl");
  items.forEach(it=>{
    const li = el("li", it.opt?"opt":"");
    li.appendChild(el("div","t",esc(it.t)));
    const b = el("div","body");
    b.appendChild(el("div","ttl", esc(it.ttl) + (it.tag? '<span class="tag">'+esc(it.tag)+'</span>' : "")));
    b.appendChild(el("div","desc", esc(it.desc)));
    if(it.link) b.appendChild(el("div","desc",'<a href="'+it.link.href+'" target="_blank" rel="noopener">'+esc(it.link.label)+' ↗</a>'));
    li.appendChild(b);
    ul.appendChild(li);
  });
  return ul;
}

/* ── 編集できるリスト（既定項目＋みんなが追加した項目） ── */
function itemsOf(g){
  const hid = state.hidden || {};
  const base = GROUPS[g].defaults.filter(it=>!hid[it.id]);
  const ex = ((state.extra||{})[g]||[]).filter(it=>it && it.id && !hid[it.id]);
  return base.concat(ex.map(it=>({id:it.id, name:it.name, sub:it.sub||"", custom:true})));
}

function groupCard(g){
  const kind = GROUPS[g].kind;
  const card = el("div","card");
  card.appendChild(progressBar(g));
  const host = el("div"); host.dataset.list = g;
  card.appendChild(host);

  const form = el("form","addform");
  form.innerHTML = '<input type="text" id="add-'+g+'" maxlength="40" autocomplete="off" placeholder="'+
    esc(g==="rec" ? "例：トランプ、花火、スピーカー" : g==="kanji" ? "確認事項を追加" : "項目を追加")+
    '"><button type="submit">追加</button>';
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const input = form.querySelector("input");
    const v = input.value.trim();
    if(!v) return;
    input.value = "";
    addItem(g, v);
  });
  card.appendChild(form);
  card.appendChild(el("p","note", "項目の追加・削除もこの端末に保存されます。削除は ✕ を2回タップ。"));
  return card;
}

function renderGroup(g){
  const host = document.querySelector('[data-list="'+g+'"]');
  if(!host) return;
  const kind = GROUPS[g].kind;
  const items = itemsOf(g);
  host.innerHTML = "";
  if(!items.length){
    host.appendChild(el("p","empty", g==="rec"
      ? "まだ何も登録されていません。下の入力欄から追加してください。"
      : "項目がありません。下の入力欄から追加できます。"));
    return;
  }
  const ul = el("ul","checks");
  items.forEach(it=>{
    const li = el("li");
    const btn = el("button","row");
    btn.type = "button"; btn.dataset.id = it.id;
    if(kind === "single"){
      const v = state.single[it.id];
      const on = !!(v && v.done);
      btn.dataset.on = on ? "1" : "0";
      btn.innerHTML = '<span class="box">'+CHECK+'</span><span class="txt"><span class="name">'+esc(it.name)+
        (it.custom? '<span class="added">追加</span>':'')+'</span>'+
        (it.sub? '<span class="sub">'+esc(it.sub)+'</span>':'')+
        (on && v.by ? '<span class="by">✓ '+esc(v.by)+'</span>' : '')+'</span>';
      btn.addEventListener("click", ()=>toggleSingle(it.id));
    }else{
      const names = ((state.multi[it.id]||{}).names)||[];
      const mine = myName && names.includes(myName);
      btn.dataset.on = mine ? "1" : "0";
      btn.innerHTML = '<span class="box">'+CHECK+'</span><span class="txt"><span class="name">'+esc(it.name)+
        (it.custom? '<span class="added">追加</span>':'')+'</span>'+
        (it.sub? '<span class="sub">'+esc(it.sub)+'</span>':'')+
        '<span class="who-chips">'+(names.length
          ? names.map(n=>'<span class="who'+(n===myName?" me":"")+'">'+esc(n)+'</span>').join("")
          : '<span class="who">まだ誰も</span>')+'</span></span>'+
        '<span class="count">'+names.length+"/"+PEOPLE.length+'</span>';
      btn.addEventListener("click", ()=>toggleMulti(it.id));
    }
    li.appendChild(btn);
    const del = el("button","del","✕");
    del.type = "button";
    del.setAttribute("aria-label", it.name+" を削除");
    del.addEventListener("click", ()=>{
      if(del.dataset.armed === "1"){ removeItem(g, it); return; }
      del.dataset.armed = "1"; del.textContent = "削除";
      setTimeout(()=>{ if(del.isConnected){ del.dataset.armed="0"; del.textContent="✕"; } }, 3000);
    });
    li.appendChild(del);
    ul.appendChild(li);
  });
  host.appendChild(ul);
}

/* ── 買い出しリスト（金額修正・追加・削除つき） ── */
const SHOP_CATS = SHOP.map((cat,ci)=>({
  ci, title:cat[0],
  items: cat[1].map((it,ii)=>({id:"s"+ci+"-"+ii, name:it[0], q:it[1], p:it[2]}))
}));
let editingId = null, draft = null;
const openCats = new Set([0]);

const num = (v,def)=>{ const n = Number(v); return Number.isFinite(n) ? n : def; };

function shopItems(ci){
  const hid = state.hidden||{}, ed = state.edits||{};
  const base = SHOP_CATS[ci].items
    .filter(it=>!hid[it.id])
    .map(it=>{ const o = Object.assign({}, it, ed[it.id]||{}); o.q = num(o.q,1); o.p = num(o.p,0); return o; });
  const ex = ((state.extra||{})["shop"+ci]||[])
    .filter(it=>it && it.id && !hid[it.id])
    .map(it=>{ const o = Object.assign({name:"", q:1, p:0}, it, ed[it.id]||{}); o.q = num(o.q,1); o.p = num(o.p,0); o.custom = true; return o; });
  return base.concat(ex);
}
function allShopItems(){ return SHOP_CATS.map(c=>shopItems(c.ci)); }

function shopRow(it, ci){
  const li = el("li");
  const v = state.single[it.id];
  const on = !!(v && v.done);
  const btn = el("button","row");
  btn.type = "button"; btn.dataset.on = on? "1":"0";
  btn.innerHTML = '<span class="box">'+CHECK+'</span><span class="txt"><span class="name">'+esc(it.name)+
    (it.q>1? '<span class="qty">×'+it.q+'</span>':'')+(it.custom? '<span class="added">追加</span>':'')+'</span>'+
    (on && v.by ? '<span class="by">✓ '+esc(v.by)+'</span>' : '')+'</span>';
  btn.addEventListener("click", ()=>toggleSingle(it.id));
  li.appendChild(btn);

  const price = el("button","pbtn", yen(it.p*it.q));
  price.type = "button";
  price.title = "金額・数量・品名を修正";
  price.setAttribute("aria-label", it.name+" の金額を修正");
  price.addEventListener("click", ()=>{
    editingId = it.id;
    draft = {name:it.name, q:it.q, p:it.p};
    renderShop();
    const f = document.querySelector('.editor input');
    if(f) f.focus();
  });
  li.appendChild(price);

  const del = el("button","del","✕");
  del.type = "button";
  del.setAttribute("aria-label", it.name+" を削除");
  del.addEventListener("click", ()=>{
    if(del.dataset.armed === "1"){ removeShopItem(ci, it); return; }
    del.dataset.armed = "1"; del.textContent = "削除";
    setTimeout(()=>{ if(del.isConnected){ del.dataset.armed="0"; del.textContent="✕"; } }, 3000);
  });
  li.appendChild(del);
  return li;
}

function shopEditor(it, ci){
  const li = el("li","editli");
  const box = el("div","editor");
  box.innerHTML =
    '<label>品名<input class="e-name" type="text" maxlength="60" value="'+esc(draft.name)+'"></label>'+
    '<div class="cols"><label>数量<input class="e-q" type="number" inputmode="numeric" min="1" step="1" value="'+draft.q+'"></label>'+
    '<label>単価（税込／円）<input class="e-p" type="number" inputmode="decimal" min="0" step="0.01" value="'+draft.p+'"></label></div>'+
    '<div class="ebtns"><button type="button" class="save">保存</button>'+
    '<button type="button" class="cancel">キャンセル</button><span class="esum"></span></div>';
  const nameI = box.querySelector(".e-name"), qI = box.querySelector(".e-q"), pI = box.querySelector(".e-p"), esum = box.querySelector(".esum");
  const refresh = ()=>{
    draft.name = nameI.value; draft.q = num(qI.value,1); draft.p = num(pI.value,0);
    esum.textContent = "小計 "+yen(Math.max(0,draft.q)*Math.max(0,draft.p));
  };
  [nameI,qI,pI].forEach(i=>i.addEventListener("input", refresh));
  refresh();
  box.querySelector(".save").addEventListener("click", ()=>{
    refresh();
    const name = draft.name.trim() || it.name;
    saveShopEdit(it, {name, q:Math.max(1,Math.round(draft.q)||1), p:Math.max(0,draft.p)});
  });
  box.querySelector(".cancel").addEventListener("click", ()=>{ editingId = null; draft = null; renderShop(); });
  li.appendChild(box);
  return li;
}

function renderShop(){
  const host = document.getElementById("shopHost");
  if(!host) return;
  const scrollY = window.scrollY;
  host.innerHTML = "";
  SHOP_CATS.forEach(cat=>{
    const ci = cat.ci;
    const items = shopItems(ci);
    const done = items.filter(it=>state.single[it.id] && state.single[it.id].done).length;
    const sum = items.reduce((a,it)=>a+it.p*it.q, 0);
    const d = el("details","cat");
    d.open = openCats.has(ci);
    d.addEventListener("toggle", ()=>{ d.open ? openCats.add(ci) : openCats.delete(ci); });
    d.appendChild(el("summary","", esc(cat.title)+'<span class="mark">'+done+'/'+items.length+' ・ '+yen(sum)+'</span>'));
    const inner = el("div");
    const ul = el("ul","checks");
    items.forEach(it=>{
      ul.appendChild(shopRow(it, ci));
      if(editingId === it.id && draft) ul.appendChild(shopEditor(it, ci));
    });
    if(!items.length) inner.appendChild(el("p","empty","項目がありません。下から追加できます。"));

/* ────────── sync UI ────────── */
function sync(opts){
  let prepDone = 0, prepTot = 0;
  GROUP_KEYS.forEach(g=>{
    renderGroup(g);
    const items = itemsOf(g), kind = GROUPS[g].kind;
    let done = 0;
    items.forEach(it=>{
      if(kind==="single") done += (state.single[it.id]&&state.single[it.id].done)?1:0;
      else done += ((state.multi[it.id]||{}).names||[]).length / PEOPLE.length;
    });
    setBar(g, items.length? Math.round(done/items.length*100) : 0);
    prepTot += items.length;
    items.forEach(it=>{
      if(kind==="single") prepDone += (state.single[it.id]&&state.single[it.id].done)?1:0;
      else prepDone += (((state.multi[it.id]||{}).names||[]).length===PEOPLE.length)?1:0;
    });
  });
  if(!(opts && opts.skipShop)) renderShop();

  // 買い出しの集計
  let sum = 0, cnt = 0, all = 0, tot = 0;
  allShopItems().forEach(items=>{
    items.forEach(it=>{
      tot++; all += it.p*it.q;
      if(state.single[it.id] && state.single[it.id].done){ sum += it.p*it.q; cnt++; }
    });
  });
  setBar("shop", tot? Math.round(cnt/tot*100):0);
  const ss=document.getElementById("shopSum"), sc=document.getElementById("shopCount"),
        sa=document.getElementById("shopAll"), sac=document.getElementById("shopAllCount");
  if(ss) ss.textContent = yen(sum);
  if(sc) sc.textContent = cnt+" / "+tot+" 品";
  if(sa) sa.textContent = yen(all);
  if(sac) sac.textContent = tot+" 品";
  // tab badges
  setBadge("prep", prepDone, prepTot);
  setBadge("shop", cnt, tot);
}
function setBar(group, pct){
  const bar = document.querySelector('[data-bar="'+group+'"]'), pctEl = document.querySelector('[data-pct="'+group+'"]');
  if(bar) bar.style.width = pct+"%";
  if(pctEl) pctEl.textContent = pct+"%";
}
function setBadge(key, done, total){
  const b = document.querySelector('[data-tabbadge="'+key+'"]');
  if(!b) return;
  b.textContent = done+"/"+total;
  b.classList.toggle("done", total>0 && done===total);
}

/* ────────── writes ────────── */
function setSyncLabel(txt, cls){
  const s = document.getElementById("sync");
  s.textContent = txt; s.className = "sync "+(cls||"");
}
function persist(){ save(); }
const fullState = ()=>({single:state.single, multi:state.multi, extra:state.extra||{}, hidden:state.hidden||{}, edits:state.edits||{}, updatedAt:Date.now()});

function toggleSingle(id){
  const cur = !!(state.single[id] && state.single[id].done);
  const v = cur? {done:false, by:"", at:Date.now()} : {done:true, by: myName||"", at:Date.now()};
  state.single = Object.assign({}, state.single, {[id]:v});
  sync();
  persist({single:{[id]:v}}, fullState);
}
function toggleMulti(id){
  if(!myName){ setSyncLabel("先に名前を選択", "off"); document.getElementById("me").focus(); return; }
  const names = (((state.multi[id]||{}).names)||[]).slice();
  const i = names.indexOf(myName);
  if(i>=0) names.splice(i,1); else names.push(myName);
  const v = {names};
  state.multi = Object.assign({}, state.multi, {[id]:v});
  sync();
  persist({multi:{[id]:v}}, fullState);
}
function addItem(g, name){
  const list = (((state.extra||{})[g])||[]).slice();
  const id = g+"-x"+Date.now().toString(36)+Math.floor(Math.random()*900+100).toString(36);
  list.push({id, name, by: myName||"", at: Date.now()});
  state.extra = Object.assign({}, state.extra, {[g]:list});
  sync();
  persist({extra:{[g]:list}}, fullState);
}
function addShopItem(ci, name, q, p){
  const key = "shop"+ci;
  const list = (((state.extra||{})[key])||[]).slice();
  const id = "sx"+ci+"-"+Date.now().toString(36)+Math.floor(Math.random()*900+100).toString(36);
  list.push({id, name, q, p, by: myName||"", at: Date.now()});
  state.extra = Object.assign({}, state.extra, {[key]:list});
  openCats.add(ci);
  sync();
  persist({extra:{[key]:list}}, fullState);
}
function removeShopItem(ci, it){
  if(it.custom){
    const key = "shop"+ci;
    const list = (((state.extra||{})[key])||[]).filter(x=>x.id !== it.id);
    state.extra = Object.assign({}, state.extra, {[key]:list});
    if(editingId === it.id){ editingId = null; draft = null; }
    sync();
    persist({extra:{[key]:list}}, fullState);
  }else{
    state.hidden = Object.assign({}, state.hidden, {[it.id]:true});
    if(editingId === it.id){ editingId = null; draft = null; }
    sync();
    persist({hidden:{[it.id]:true}}, fullState);
  }
}
function saveShopEdit(it, patch){
  const v = {name:patch.name, q:patch.q, p:patch.p, by: myName||"", at: Date.now()};
  state.edits = Object.assign({}, state.edits, {[it.id]:v});
  editingId = null; draft = null;
  sync();
  persist({edits:{[it.id]:v}}, fullState);
}
function removeItem(g, it){
  if(it.custom){
    const list = (((state.extra||{})[g])||[]).filter(x=>x.id !== it.id);
    state.extra = Object.assign({}, state.extra, {[g]:list});
    sync();
    persist({extra:{[g]:list}}, fullState);
  }else{
    state.hidden = Object.assign({}, state.hidden, {[it.id]:true});
    sync();
    persist({hidden:{[it.id]:true}}, fullState);
  }
}
